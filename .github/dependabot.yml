version: 2
updates:
  # Python dependencies (pip).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: "monthly"
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "monthly"
      day: monday
    labels:
      - dependencies
      - github-actions

  # Dockerfile base image.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "monthly"
      day: monday
    labels:
      - dependencies
      - docker
